<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="author" content="%SEO_NAME%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SEO_URL%/" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preload" as="image" href="/brand/rr-logo-96.webp" type="image/webp" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SEO_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%/" />
    <meta property="og:image" content="%SEO_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SEO_OG_IMAGE_ALT%" />
    <meta property="og:locale" content="%SEO_LOCALE%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%SEO_OG_IMAGE_ALT%" />
    <!-- twitter:site -->

    <script type="application/ld+json">%JSON_LD%</script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#fff;background:#080808">
        Rishu Raj — Founder &amp; Builder. Please enable JavaScript to view this site.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
